[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/windmill/supervisord.pid

[program:postgresql]
command=gosu postgres /usr/lib/postgresql/16/bin/postgres -D /app/data/postgresql -c listen_addresses=127.0.0.1 -c port=5432
autostart=true
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=gosu cloudron:cloudron caddy run --config /app/code/Caddyfile --adapter caddyfile
directory=/app/code
autostart=true
autorestart=true
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=WINDMILL_SERVER_INTERNAL_ADDR="%(ENV_WINDMILL_SERVER_INTERNAL_ADDR)s",LSP_SERVER_INTERNAL_ADDR="%(ENV_LSP_SERVER_INTERNAL_ADDR)s"

[program:windmill-server]
command=gosu cloudron:cloudron /usr/local/bin/windmill
directory=/app/code
autostart=true
autorestart=true
priority=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",BASE_URL="%(ENV_CLOUDRON_APP_ORIGIN)s",MODE="server",PORT="8001",SMTP_HOST="%(ENV_CLOUDRON_MAIL_SMTP_SERVER)s",SMTP_PORT="%(ENV_CLOUDRON_MAIL_SMTP_PORT)s",SMTP_USERNAME="%(ENV_CLOUDRON_MAIL_SMTP_USERNAME)s",SMTP_PASSWORD="%(ENV_CLOUDRON_MAIL_SMTP_PASSWORD)s",SMTP_FROM="%(ENV_CLOUDRON_MAIL_FROM)s"

[program:windmill-worker]
command=gosu cloudron:cloudron /usr/local/bin/windmill
directory=/app/code
autostart=true
autorestart=true
priority=300
numprocs=1
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",MODE="worker",WORKER_GROUP="default"

[program:windmill-worker-native]
command=gosu cloudron:cloudron /usr/local/bin/windmill
directory=/app/code
autostart=true
autorestart=true
priority=300
numprocs=1
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",MODE="worker",WORKER_GROUP="native",NUM_WORKERS="8",SLEEP_QUEUE="200"

[program:credential-inject]
command=/app/code/inject-credentials.sh
autostart=true
autorestart=false
startsecs=0
exitcodes=0
priority=400
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
